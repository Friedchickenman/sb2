spring:
  
  thymeleaf:
  
    cache: false
  
  datasource:
    url: jdbc:mariadb://localhost:3306/bootdb3
    driver-class-name: org.mariadb.jdbc.Driver
    username: bootdbuser3
    password: bootdbuser3
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 2000
  
  # JPA Config (spring: 아래에 올바르게 들여쓰기)
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  
  sql:
    init:
      mode: never


    
logging:
  level:
    org.zerock.sb2: INFO
  



